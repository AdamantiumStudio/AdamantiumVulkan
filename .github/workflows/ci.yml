# Builds the solution, the binding generator included, tests the bindings and packs the four published packages, on
# Windows, Linux and macOS; builds the shader-object layer on each of them and packs its package from the three. The
# bindings are not regenerated here: the generator needs an installed Vulkan SDK for the SPIR-V headers.
# The tests draw on Linux with lavapipe, Mesa's Vulkan on the CPU, under the validation layer; the Windows and macOS
# runners have no Vulkan driver, so there the tests that need a device are ignored and the rest run.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # A branch of this repository is built on push, so pull_request builds only the ones from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      # QuantumBinding beside it, for the binding generator: a generator change is built here once it is merged.
      - name: QuantumBinding
        shell: bash
        run: |
          git clone --depth 1 --branch master https://github.com/AdamantiumStudio/QuantumBinding.git ../QuantumBinding
          git -C ../QuantumBinding log -1 --format='QuantumBinding at %h: %s'

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build AdamantiumVulkan.sln -c Release -warnaserror

      - name: Vulkan on the CPU
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers vulkan-validationlayers
          echo "ADAMANTIUM_VULKAN_TESTS_NEED_A_DEVICE=1" >> "$GITHUB_ENV"
          echo "ADAMANTIUM_VULKAN_TESTS_NEED_VALIDATION=1" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test Adamantium.Vulkan.Tests/Adamantium.Vulkan.Tests.csproj -c Release --no-build

      - name: Pack
        shell: bash
        run: |
          for p in Adamantium.Vulkan Adamantium.Vulkan.Loader Adamantium.Vulkan.Slang Adamantium.Vulkan.Spirv; do
            dotnet pack "$p/$p.csproj" -c Release -o artifacts
          done
          for f in artifacts/*.nupkg; do
            unzip -l "$f" | grep -q ' icon.png$' || { echo "$f has no icon.png"; exit 1; }
          done

  shader-object-layer:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/shader-object-layer.yml

  # The layer package from the three platforms' builds, as publishing packs it - and a check that none is missing.
  pack-shader-object-layer:
    needs: shader-object-layer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v7
        with:
          pattern: shader-object-layer-*
          path: Adamantium.Vulkan.ShaderObjectLayer/layers
          merge-multiple: true

      - name: Pack
        run: |
          dotnet pack Adamantium.Vulkan.ShaderObjectLayer/Adamantium.Vulkan.ShaderObjectLayer.csproj -c Release -o artifacts
          unzip -l artifacts/Adamantium.Vulkan.ShaderObjectLayer.*.nupkg
          unzip -l artifacts/Adamantium.Vulkan.ShaderObjectLayer.*.nupkg | grep -q ' icon.png$' || { echo "no icon.png"; exit 1; }
          for f in win-x64/VkLayer_khronos_shader_object.dll linux-x64/libVkLayer_khronos_shader_object.so \
                   osx-arm64/libVkLayer_khronos_shader_object.dylib; do
            for file in "layers/$f" "layers/$(dirname "$f")/VkLayer_khronos_shader_object.json"; do
              unzip -l artifacts/Adamantium.Vulkan.ShaderObjectLayer.*.nupkg | grep -q "$file" || { echo "missing $file"; exit 1; }
            done
          done
